<app-header></app-header>

<main class="min-h-screen bg-gray-50/50 pt-[110px] pb-20 font-sans">
  <div class="container mx-auto px-4 max-w-7xl">
    
    <div class="bg-white/85 backdrop-blur-md rounded-2xl shadow-xl shadow-gray-200/40 p-2 max-w-5xl mx-auto border border-gray-100/80 flex flex-col md:flex-row items-center gap-1 mb-16 relative z-30 transition-all duration-300 hover:shadow-2xl hover:shadow-gray-200/60">
      
      <div id="customTypeSelect" class="w-full md:w-[32%] px-4 py-2 flex items-center gap-3 hover:bg-gray-50/80 rounded-xl transition-all duration-200 group cursor-pointer relative"
           (click)="isTypeDropdownOpen = !isTypeDropdownOpen">
        <div class="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Loại phòng</label>
          <span class="text-sm font-bold text-gray-700 block truncate">{{ searchRequest.typeName || 'Tất cả loại phòng' }}</span>
        </div>
        <div *ngIf="isTypeDropdownOpen" class="absolute left-0 right-0 top-[110%] bg-white border border-gray-100 rounded-xl shadow-xl z-50 p-1.5">
          <div class="px-3 py-2 text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 rounded-lg" (click)="selectType('')">Tất cả loại phòng</div>
          <div *ngFor="let type of roomTypes" class="px-3 py-2 text-sm font-medium text-gray-600 hover:bg-blue-50 hover:text-blue-600 rounded-lg" (click)="selectType(type.typeName)">{{ type.typeName }}</div>
        </div>
      </div>

      <div class="hidden md:block w-px h-8 bg-gray-200/60 mx-1"></div>

      <div class="w-full md:w-[23%] px-4 py-2 flex items-center gap-3 hover:bg-gray-50/80 rounded-xl transition-all duration-200 group">
        <div class="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 3V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        </div>
        <div class="flex-1">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Nhận phòng</label>
          <input type="date" [(ngModel)]="searchRequest.checkIn" class="text-sm font-bold text-gray-700 block w-full bg-transparent border-none outline-none p-0 focus:ring-0 cursor-pointer" />
        </div>
      </div>

      <div class="hidden md:block w-px h-8 bg-gray-200/60 mx-1"></div>

      <div class="w-full md:w-[23%] px-4 py-2 flex items-center gap-3 hover:bg-gray-50/80 rounded-xl transition-all duration-200 group">
        <div class="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 3V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
        </div>
        <div class="flex-1">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Trả phòng</label>
          <input type="date" [(ngModel)]="searchRequest.checkOut" class="text-sm font-bold text-gray-700 block w-full bg-transparent border-none outline-none p-0 focus:ring-0 cursor-pointer" />
        </div>
      </div>

      <div class="hidden md:block w-px h-8 bg-gray-200/60 mx-1"></div>

      <div class="w-full md:w-[15%] px-4 py-2 flex items-center gap-3 hover:bg-gray-50/80 rounded-xl transition-all duration-200 group">
        <div class="p-2 bg-blue-50 text-blue-600 rounded-lg group-hover:bg-blue-600 group-hover:text-white transition-all duration-300 shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>
        <div class="flex-1">
          <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block mb-0.5">Số khách</label>
          <input type="number" min="1" placeholder="1" [(ngModel)]="searchRequest.guestCount" class="text-sm font-bold text-gray-700 block w-full bg-transparent border-none outline-none p-0 focus:ring-0" />
        </div>
      </div>

      <div class="w-full md:w-auto flex items-center gap-1 p-1 shrink-0">
        <button (click)="resetSearch()" class="p-3.5 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-all"><svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18" /></svg></button>
        <button (click)="searchRooms()" class="w-full md:w-auto bg-blue-600 text-white px-6 py-3.5 rounded-xl font-bold text-sm shadow-lg hover:bg-blue-700 transition-all">Tìm kiếm</button>
      </div>
    </div>

    <div *ngIf="!isLoading && rooms.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
      <div *ngFor="let room of rooms" (click)="viewRoomDetail(room.roomId, $event)" class="bg-white rounded-2xl overflow-hidden border border-gray-100/90 shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1.5 group cursor-pointer flex flex-col h-full relative">
        
        <div class="relative pt-[68%] overflow-hidden bg-gray-100 shrink-0">
          <img [src]="getRoomImage(room)" [alt]="room.roomNumber" class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 group-hover:scale-106" />
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-black/5 to-transparent opacity-80"></div>
          
          <button (click)="toggleFavorite($event, room)" class="absolute top-4 right-4 w-9 h-9 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center z-20">
            <svg class="w-5 h-5 transition-all" [ngClass]="room.isFavorite ? 'text-rose-500 fill-rose-500 scale-110' : 'text-white fill-transparent'" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
            </svg>
          </button>

          <span class="absolute bottom-4 left-4 text-[10px] font-black uppercase tracking-wider px-2.5 py-1.5 rounded-lg z-10"
                [ngClass]="room.status === 'AVAILABLE' || !room.status ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white'">
            {{ (room.status === 'AVAILABLE' || !room.status) ? 'Còn trống' : 'Đã đặt' }}
          </span>
        </div>

        <div class="p-6 flex flex-col flex-1">
          <div class="flex items-start justify-between gap-2 mb-2">
            <h3 class="text-xl font-black text-gray-800">Phòng {{ room.roomNumber }}</h3>
            <span class="px-2.5 py-1 bg-blue-50 text-blue-600 text-[11px] font-extrabold rounded-md uppercase">{{ room.typeName || 'Standard' }}</span>
          </div>

          <div class="flex items-center justify-between mt-6 pt-4 border-t border-gray-100/80 mt-auto">
            <div>
              <span class="text-[10px] text-gray-400 block font-bold uppercase tracking-wider">Giá phòng/Đêm</span>
              <span class="text-2xl font-black text-blue-600 tracking-tight">{{ formatPrice(room.price) }}</span>
            </div>
            <div class="flex items-center gap-2">
              <button (click)="viewRoomDetail(room.roomId, $event)" class="px-3.5 py-2.5 border border-gray-200 text-gray-600 rounded-xl font-bold text-xs hover:bg-gray-50">Chi tiết</button>
              <button [disabled]="room.status && room.status !== 'AVAILABLE'" class="px-5 py-2.5 bg-blue-600 text-white rounded-xl font-bold text-xs hover:bg-blue-700">Đặt ngay</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
