<header class="fixed w-full z-50 bg-white/90 backdrop-blur-md shadow-sm border-b border-gray-100">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    
    <div routerLink="/" class="text-2xl font-black text-blue-600 cursor-pointer flex items-center tracking-tight select-none">
      <span class="mr-2 text-3xl">🏨</span> LuxeHotel
    </div>

    <nav class="hidden md:flex space-x-8 items-center">
      <a routerLink="/" routerLinkActive="text-blue-600" [routerLinkActiveOptions]="{exact: true}" class="text-gray-600 hover:text-blue-600 font-bold text-sm transition">Trang chủ</a>
      <a routerLink="/rooms" (click)="onRoomsClick()" routerLinkActive="text-blue-600" class="text-gray-600 hover:text-blue-600 font-bold text-sm transition cursor-pointer">Phòng</a>
      <a href="#about" class="text-gray-600 hover:text-blue-600 font-bold text-sm transition">Giới thiệu</a>
      <a href="#contact" class="text-gray-600 hover:text-blue-600 font-bold text-sm transition">Liên hệ</a>
    </nav>

    <div class="flex items-center space-x-4">
      
      <ng-container *ngIf="!(authService.isLoggedIn$ | async)">
        <div class="flex space-x-2">
          <button routerLink="/login" class="px-5 py-2.5 text-blue-600 font-bold text-sm hover:bg-blue-50/80 rounded-xl transition">Đăng nhập</button>
          <button routerLink="/register" class="px-5 py-2.5 bg-blue-600 text-white font-bold text-sm rounded-xl hover:bg-blue-700 shadow-md shadow-blue-100 transition active:scale-95">Đăng ký</button>
        </div>
      </ng-container>

      <ng-container *ngIf="authService.isLoggedIn$ | async">
        <div class="flex items-center space-x-3">
          
          <a routerLink="/favorites" 
             routerLinkActive="bg-red-50 text-red-500 border-red-200 active-favorite" 
             class="favorite-nav-btn flex items-center justify-center w-9 h-9 text-gray-500 hover:text-red-500 hover:bg-red-50 rounded-full transition border border-gray-100 shadow-sm bg-white"
             title="Danh sách yêu thích">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="h-5 w-5 transition-all duration-200">
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" />
            </svg>
          </a>

          <div id="userDropdownBlock" class="relative">
            <button (click)="toggleDropdown($event)" class="flex items-center space-x-2.5 p-1 pr-3.5 bg-gray-50 hover:bg-gray-100 rounded-full transition border border-transparent hover:border-gray-200 focus:outline-none">
              <div class="w-8 h-8 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-full flex items-center justify-center text-white font-extrabold text-xs shadow-sm select-none">
                {{ getUserInitials() }}
              </div>
              <span class="hidden sm:inline font-bold text-sm text-gray-700 tracking-tight">{{ getUserName() }}</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-gray-400 transition-transform duration-200" [ngClass]="{'rotate-180 text-blue-600': isDropdownOpen}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            <div *ngIf="isDropdownOpen" class="absolute right-0 mt-2.5 w-56 bg-white border border-gray-100/70 rounded-2xl shadow-2xl py-2 z-[60]">
              <div class="px-4 py-1.5 border-b border-gray-50 mb-1">
                <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">Quản lý Tài khoản</p>
              </div>
              
              <a routerLink="/profile" (click)="closeDropdown()" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition">
                <span class="mr-3 text-base">👤</span> Thông tin cá nhân
              </a>

              <a (click)="onHistoryClick()" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition cursor-pointer">
                <span class="mr-3 text-base">🕒</span> Lịch sử đặt phòng
              </a>
              
              <a routerLink="/favorites" (click)="closeDropdown()" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-red-600 transition">
                <span class="mr-3 text-base">❤️</span> Phòng yêu thích
              </a>

              <a routerLink="/profile" [queryParams]="{tab: 'password'}" (click)="closeDropdown()" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition">
                <span class="mr-3 text-base">🔑</span> Đổi mật khẩu
              </a>
              
              <a *ngIf="authService.getRole() === 'ADMIN'" routerLink="/admin" (click)="closeDropdown()" class="flex items-center px-4 py-2.5 text-sm font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-600 transition border-t border-gray-50 mt-1">
                <span class="mr-3 text-base">🛡️</span> Quản trị hệ thống
              </a>
              
              <div class="border-t border-gray-50 mt-1">
                <button (click)="logout()" class="w-full flex items-center px-4 py-2.5 text-sm font-bold text-red-600 hover:bg-red-50 transition text-left">
                  <span class="mr-3 text-base">🚪</span> Đăng xuất
                </button>
              </div>
            </div>
          </div>

        </div>
      </ng-container>
    </div>
  </div>
</header>
